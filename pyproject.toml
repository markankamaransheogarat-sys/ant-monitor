[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ant-monitor"
version = "0.1.0"
description = "Real-time Binance Futures (ANTUSDT), Nasdaq Spot (ANT), and Anthropic IPO news monitor with Telegram alerts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0,<1.0.0",
    "yfinance>=0.2.50,<2.0.0",
    "feedparser>=6.0.11,<7.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-asyncio>=0.24.0,<2.0.0",
]

[project.scripts]
ant-monitor = "ant_monitor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
